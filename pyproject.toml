[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hidctl"
version = "0.1.0"
description = "Controle de periféricos USB HID no Linux"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
hid = ["hidapi>=0.14"]
gui = ["PySide6>=6.7"]
dev = ["pytest>=8", "ruff==0.17.3"]

[project.scripts]
hidctl = "hidctl.cli:main"
hidctl-gui = "hidctl.gui.app:main"

[tool.setuptools.packages.find]
include = ["hidctl*"]

[tool.setuptools.package-data]
"hidctl.gui" = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
